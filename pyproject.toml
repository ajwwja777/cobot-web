[project]
name = "cobot-web"
version = "0.2.0"
description = "Cobot operator web console and compatibility adapters"
requires-python = ">=3.8,<3.9"
dependencies = [
  "fastapi==0.124.4",
  "uvicorn==0.33.0",
  "h5py==3.11.0",
  "numpy==1.24.4",
  "pydantic==2.10.6",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "pillow==10.4.0",
  "opencv-python-headless==4.10.0.84",
  "rospkg==1.6.1",
  "catkin-pkg==1.1.0",
  "websockets==13.1"
]

[dependency-groups]
dev = ["pytest==8.3.5", "tomli==2.4.1", "pyarrow==17.0.0", "pandas==2.0.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["app/backend/tests"]
pythonpath = ["app/backend"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
ignore = ["UP006", "UP045"]
